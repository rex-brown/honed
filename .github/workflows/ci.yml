# Checks every pull request and every push to main (CONTRIBUTING.md). No network beyond installing dependencies,
# no model calls: the fixture-PR replay answers from cached model answers under tests/fixtures/replay/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]  # the oldest supported, and the one development uses (`.python-version`)
    steps:
      - uses: actions/checkout@v7

      # The uv release `[tool.uv] required-version` in pyproject.toml starts at, so CI and development use one uv
      # series, checked against the SHA-256 of uv-x86_64-unknown-linux-gnu.tar.gz from its release page.
      # `python-version` sets UV_PYTHON, which takes precedence over `.python-version`: each leg runs its own Python.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.13.5"
          checksum: "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f"
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install (from the lockfile)
        run: uv sync --locked

      - name: Tests (the blinding and safety-invariant tests among them)
        run: uv run pytest

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Layer contracts
        run: uv run lint-imports

      - name: Fixture-PR replay (the planted bug must still be reported)
        run: uv run python scripts/replay_fixture.py
