# honed: the single configuration file. Read only through `honed.config`.
# Paths are relative to this file's directory.

# true swaps every adapter to its local or replay implementation; online-only commands refuse to run.
offline = false

[paths]
data = "data"
sqlite = "data/prreview.sqlite"   # the store: keeps its pre-rename file name, so data/ and data-dev/ open as they are
blobs = "data/blobs"          # content-addressed, zlib-compressed large text (patches, hunks, pack files)
clones = "data/clones"        # bare partial clones used to build context packs
cache = "data/cache"
llm_status = "data/llm_status.json"      # heartbeat, rewritten after every live model call
human_labels = "yardstick/human_labels"  # yardstick, committed: the blind sample and people's labels-<username>.json
human_labels_page = "tools/human-labels/index.html"  # the labeling page `honed human-labels serve` serves
reports = "data/reports"                 # evaluation reports (`honed eval`), one JSON file per run
models = "data/models"                   # downloaded local models (`honed fetch-local-model`), one directory each
benchmarks = "data/benchmarks"           # downloaded public benchmarks (`honed import-benchmark --fetch`)
yardstick_prompts = "yardstick/prompts"  # judge prompts: outside policy/, so the improve loop can't edit its judge
policy = "policy"                        # the incumbent reviewer policy: the default `--policy`
removals_file = "yardstick/removals.json"   # PRs and comments every bundle export leaves out (DATASET.md, Removal)
exports = "data/exports"                 # `honed export-gold` output, one directory per format
# `honed --data-dir PATH` moves every entry under `data` above to the same place under PATH, for a run on a copy.

